# Local demo: app + Postgres seeded with fake parties. Credentials below are local-only.
services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: teekhao
      POSTGRES_PASSWORD: teekhao
      POSTGRES_DB: teekhao
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U teekhao"]
      interval: 2s
      timeout: 3s
      retries: 20
  app:
    build: .
    depends_on:
      db:
        condition: service_healthy
    environment:
      POSTGRES_URL: postgres://teekhao:teekhao@db:5432/teekhao
      PGSSLMODE: disable
      DEMO_MODE: "1"
      SEED_ON_START: "1"
      SCAN_DAILY_LIMIT: "20"
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
    ports:
      - "3000:3000"
